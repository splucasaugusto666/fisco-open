name: MCP integration
on:
  push:
    branches: [main]
    paths: ['fisco_open/**', 'tests_mcp/**', 'pyproject.toml', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['fisco_open/**', 'tests_mcp/**', 'pyproject.toml', '.github/workflows/mcp.yml']
permissions:
  contents: read
jobs:
  stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mcp]'
      - run: python -m unittest discover -s tests_mcp -v
